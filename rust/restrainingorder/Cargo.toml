[package]
name = "restrainingorder"
description = "Mouse strain identification from alignments to an N-masked multi-strain genome"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../README.md"
keywords = ["bioinformatics", "genomics", "mouse", "snp", "strain"]
categories = ["science", "command-line-utilities"]
include = ["src/**/*", "banners/*", "help/*", "tests/**/*", "Cargo.toml"]

[[bin]]
name = "restrainingorder"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
flate2.workspace = true
libc.workspace = true
noodles-bam.workspace = true
noodles-bgzf.workspace = true
noodles-sam.workspace = true

[dev-dependencies]
tempfile.workspace = true
