[workspace]
members = ["restrainingorder"]
resolver = "3"

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-or-later"
repository = "https://github.com/FelixKrueger/reStrainingOrder"

[workspace.dependencies]
anyhow = "1.0"
flate2 = "1.1"
noodles-bam = "0.94"
noodles-bgzf = "0.51"
noodles-sam = "0.89"
tempfile = "3.27"

[profile.release]
lto = "thin"
codegen-units = 1
