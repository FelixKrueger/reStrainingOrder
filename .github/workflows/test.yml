name: Perl fixtures

on:
  push:
  pull_request:

jobs:
  perl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install samtools
        run: sudo apt-get update && sudo apt-get install -y samtools
      - name: Run the fixture suite against the Perl scripts
        run: python3 test/run_tests.py --impl .
